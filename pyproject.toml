[project]
name = "ap-rag-agent"
version = "0.1.0"
description = "Production-minded accounts-payable RAG agent (take-home assessment)"
requires-python = ">=3.12,<3.13"
# Exact versions are locked in uv.lock and exported to requirements.lock (§7 "pin or lock").
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "anthropic>=0.40",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
ap = "ap_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ap_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
# Docs hold compact schema sketches, not runnable code.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: needs ANTHROPIC_API_KEY and network; excluded from the stable tier (§7)",
]
